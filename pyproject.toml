[project]
name = "cricket-scoring-system"
version = "1.0.0"
description = "Live Cricket Scoring System - ESPN-style Tkinter desktop application"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]

[project.scripts]
cricket-scorer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
